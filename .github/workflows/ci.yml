name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (sin autofix)
        run: npx eslint "{src,test}/**/*.ts"

      - name: Formato
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests con cobertura
        run: npm run test:cov -- --passWithNoTests

      - name: Build
        run: npm run build

      - name: Subir cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    # No bloquea mientras se resuelven las vulnerabilidades existentes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Auditar dependencias de producción
        run: npm audit --omit=dev --audit-level=high
